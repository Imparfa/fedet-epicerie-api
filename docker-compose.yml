services:
  fedet_database:
    image: postgres:latest
    container_name: fedet_db
    restart: always
    environment:
      POSTGRES_DB: "FEDET"
      POSTGRES_USER: root
      POSTGRES_PASSWORD: fedet2025*
    ports:
      - "5432:5432"
    volumes:
      - fedet_data:/var/lib/postgresql/data

  fedet_api:
    image: fedet_api:latest
    container_name: fedet_api
    restart: always
    depends_on:
      - fedet_database
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://database:5432/FEDET
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: fedet2025*
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    ports:
      - "8080:8080"

volumes:
  fedet_data:
